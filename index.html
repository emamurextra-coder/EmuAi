<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emu AI</title>
    <style>
        /* Minimalist, Clean Theme */
        :root {
            --bg-color: #ffffff;
            --sidebar-bg: #f0f4f9;
            --text-main: #1f1f1f;
            --text-muted: #444746;
            --border-color: #e3e3e3;
            --user-bubble: #f0f4f9;
            --accent-color: #0b57d0; /* A clean, professional blue */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Layout */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 30px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .new-chat-btn {
            background-color: white;
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            text-align: left;
            transition: background-color 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .new-chat-btn:hover { background-color: #f8f9fa; }

        /* Main Chat Area */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            align-items: center;
        }

        .chat-messages {
            width: 100%;
            max-width: 800px;
            flex: 1;
            padding: 40px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            width: 100%;
        }

        .message-row.user { justify-content: flex-end; }
        .message-row.ai { justify-content: flex-start; }

        .message {
            max-width: 80%;
            line-height: 1.6;
            font-size: 1rem;
            color: var(--text-main);
        }

        .user .message {
            background-color: var(--user-bubble);
            padding: 12px 20px;
            border-radius: 24px;
        }

        .ai .message {
            padding: 12px 0; /* AI messages don't have bubbles in clean UI */
            white-space: pre-wrap; /* Keeps line breaks formatting */
        }

        /* Input Area */
        .input-container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            background-color: var(--bg-color);
        }

        .input-box {
            display: flex;
            background-color: #f0f4f9;
            border-radius: 30px;
            padding: 8px 8px 8px 24px;
            align-items: center;
        }

        #user-input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 1rem;
            color: var(--text-main);
        }

        #send-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.2s;
        }

        #send-btn:hover { opacity: 0.9; }
        
        .loading-text {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo">
        <span style="font-size: 1.5rem;">✨</span> Emu AI
    </div>
    <button class="new-chat-btn" onclick="location.reload()">+ New chat</button>
</div>

<div class="main-chat">
    <div class="chat-messages" id="chat-messages">
        <div class="message-row ai">
            <div class="message">Hi, I'm Emu AI. I am now fully connected and ready to help. What's on your mind?</div>
        </div>
    </div>
    
    <div class="input-container">
        <div class="input-box">
            <input type="text" id="user-input" placeholder="Enter a prompt here" autocomplete="off">
            <button id="send-btn">↑</button>
        </div>
    </div>
</div>

<script>
    // 🛑 DANGER ZONE: Replace with your actual API key. Do not publish this file online!
    const API_KEY = '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';
    
    const chatMessages = document.getElementById('chat-messages');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function appendMessage(text, sender) {
        const row = document.createElement('div');
        row.className = `message-row ${sender}`;
        
        const msg = document.createElement('div');
        msg.className = 'message';
        msg.textContent = text;
        
        row.appendChild(msg);
        chatMessages.appendChild(row);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return msg; // Return the element so we can update it later
    }

    async function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;

        // 1. Show user message
        appendMessage(text, 'user');
        userInput.value = '';

        // 2. Show loading indicator
        const loadingMsg = appendMessage("Thinking...", 'ai');
        loadingMsg.classList.add('loading-text');

        // 3. Call the REAL API
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            if (!response.ok) throw new Error('API Request Failed');
            
            const data = await response.json();
            const aiResponseText = data.candidates[0].content.parts[0].text;
            
            // 4. Replace loading text with the real answer
            loadingMsg.classList.remove('loading-text');
            loadingMsg.textContent = aiResponseText;

        } catch (error) {
            console.error('Error:', error);
            loadingMsg.classList.remove('loading-text');
            loadingMsg.textContent = "I encountered an error. Please make sure your API Key is correct and you are connected to the internet.";
        }
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSend();
    });
</script>

</body>
</html>
