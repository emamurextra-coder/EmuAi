<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emu AI</title>
    <style>
        /* ---------------- CSS Variables for easy Theme Toggling ---------------- */
        :root {
            --bg-overlay: rgba(255, 255, 255, 0.75);
            --sidebar-bg: rgba(240, 240, 245, 0.85);
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: rgba(0, 0, 0, 0.1);
            --user-msg-bg: #e2e8f0;
            --input-bg: #ffffff;
            --emu-orange: #ff7e67;
            --emu-orange-hover: #e66a55;
        }

        .dark-mode {
            --bg-overlay: rgba(20, 20, 25, 0.8);
            --sidebar-bg: rgba(30, 30, 40, 0.9);
            --text-main: #f4f4f9;
            --text-muted: #aaaaaa;
            --border-color: rgba(255, 255, 255, 0.1);
            --user-msg-bg: #3e3e50;
            --input-bg: #2a2a35;
        }

        /* ---------------- Base Styles & Background ---------------- */
        body {
            background-image: url('background.png'); 
            background-size: cover;          
            background-position: center;     
            background-repeat: no-repeat;  
            background-attachment: fixed;   
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            color: var(--text-main);
            display: flex;
            overflow: hidden;
            transition: background-color 0.3s;
        }

        /* ---------------- App Layout (Sidebar + Main) ---------------- */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            backdrop-filter: blur(4px); /* Adds a slight blur to the background image */
            background-color: var(--bg-overlay);
        }

        /* ---------------- Sidebar Styles ---------------- */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .new-chat-btn {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background-color: rgba(0,0,0,0.05);
        }

        .dark-mode .new-chat-btn:hover {
            background-color: rgba(255,255,255,0.05);
        }

        .chat-history {
            flex: 1;
            margin-top: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background-color: rgba(0,0,0,0.05);
            color: var(--text-main);
        }

        .dark-mode .history-item:hover {
            background-color: rgba(255,255,255,0.05);
        }

        .sidebar-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .setting-btn {
            background: none;
            border: none;
            color: var(--text-main);
            text-align: left;
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .setting-btn:hover {
            background-color: rgba(0,0,0,0.05);
        }

        .dark-mode .setting-btn:hover {
            background-color: rgba(255,255,255,0.05);
        }

        /* ---------------- Main Chat Area Styles ---------------- */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-dot {
            width: 12px;
            height: 12px;
            background-color: var(--emu-orange);
            border-radius: 50%;
            display: inline-block;
        }

        .chat-messages {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 75%;
            padding: 15px 20px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 1.05rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .user-message {
            background-color: var(--user-msg-bg);
            color: var(--text-main);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background-color: var(--emu-orange);
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        /* ---------------- Input Area Styles ---------------- */
        .chat-input-wrapper {
            padding: 20px 30px;
            background: transparent;
        }

        .chat-input-box {
            display: flex;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 8px 8px 8px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            align-items: center;
        }

        #user-input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        #send-btn {
            background-color: var(--emu-orange);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            transition: background-color 0.2s, transform 0.1s;
        }

        #send-btn:hover { background-color: var(--emu-orange-hover); }
        #send-btn:active { transform: scale(0.95); }

    </style>
</head>
<body>

<div class="app-container">
    
    <div class="sidebar">
        <button class="new-chat-btn" id="new-chat-btn">
            ➕ New Chat
        </button>
        
        <div class="chat-history">
            <div class="history-item">💬 Creating a backend server</div>
            <div class="history-item">💬 Adding a background image</div>
            <div class="history-item">💬 What is an API key?</div>
            </div>

        <div class="sidebar-footer">
            <button class="setting-btn" id="theme-toggle">
                🌙 Toggle Dark Mode
            </button>
            <button class="setting-btn" id="clear-chat-btn">
                🗑️ Clear Current Chat
            </button>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <span class="header-dot"></span> Emu AI
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message ai-message">
                Hello again! I love the new layout. Check out the settings in the sidebar! How can I help you today?
            </div>
        </div>
        
        <div class="chat-input-wrapper">
            <div class="chat-input-box">
                <input type="text" id="user-input" placeholder="Message Emu AI..." autocomplete="off">
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>

</div>
